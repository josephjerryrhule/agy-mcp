name: Build & Release MCPB Artifact

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Bundle & MCPB
        run: |
          npm run build
          npm run bundle:mcpb

      - name: Upload MCPB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-mcp.mcpb
          path: build/agy-mcp.mcpb

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/agy-mcp.mcpb
          generate_release_notes: true
